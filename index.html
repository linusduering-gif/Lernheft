<style>
/* Layout: one centred exercise-book column on 5-mm squared paper; slim header, then the current view as cards */
:root{
  --paper:#fbfcf8; --grid:#e0e8f2; --surface:#ffffff; --line:#d4dbe7; --tint:#eef2fa;
  --ink:#1c2f6e; --ink-soft:#5b678c; --red:#cf2338; --ok:#1d8048; --label-ink:#1c2f6e; --label:#ffffff;
  --c-mathe:#2c6bd3; --c-deutsch:#d23b3b; --c-hsu:#2e9558; --c-englisch:#d99a08; --c-religion:#8550c2; --c-musik:#df7026; --c-sonst:#76808f;
  --shadow:0 1px 0 rgba(28,47,110,.06),0 8px 20px -12px rgba(28,47,110,.45);
  --f-display:"Playpen Sans","Comic Neue","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a2824; --grid:#22342e; --surface:#22332d; --line:#36493f; --tint:#2a3d36;
  --ink:#eef2e8; --ink-soft:#a9b9af; --red:#ff7676; --ok:#62d194;
  --c-mathe:#4f8ae8; --c-deutsch:#e45a5a; --c-hsu:#3eae6d; --c-englisch:#e7b42c; --c-religion:#a07ae0; --c-musik:#ec8a45; --c-sonst:#8c96a4;
  --shadow:0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#1a2824; --grid:#22342e; --surface:#22332d; --line:#36493f; --tint:#2a3d36;
  --ink:#eef2e8; --ink-soft:#a9b9af; --red:#ff7676; --ok:#62d194;
  --c-mathe:#4f8ae8; --c-deutsch:#e45a5a; --c-hsu:#3eae6d; --c-englisch:#e7b42c; --c-religion:#a07ae0; --c-musik:#ec8a45; --c-sonst:#8c96a4;
  --shadow:0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark;}

body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.6rem,4.5vw,2.1rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink-soft)}
.small{font-size:.88rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c-mathe);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;background:none;border:0;padding:0}
.brand-mark{width:30px;height:36px;border-radius:4px 7px 7px 4px;background:var(--c-mathe);position:relative;box-shadow:var(--shadow)}
.brand-mark::after{content:"";position:absolute;left:6px;right:5px;top:8px;height:10px;background:var(--label);border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);padding:10px 20px;font-weight:700;min-height:46px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.notice{border-left:4px solid var(--c-englisch);background:var(--tint);padding:12px 14px;border-radius:8px}
.err{border-left:4px solid var(--red);background:var(--tint);padding:12px 14px;border-radius:8px}

/* Hefte */
.hefte{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.heft{position:relative;aspect-ratio:3/4;max-width:100%;border:0;border-radius:6px 12px 12px 6px;background:var(--c);box-shadow:var(--shadow);padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .15s}
.heft::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.heft:hover{transform:translateY(-3px) rotate(-1deg)}
.heft-label{background:var(--label);color:var(--label-ink);width:76%;border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left}
.heft-label small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
.heft-label b{font-family:var(--f-display);font-size:1.05rem;border-bottom:1px solid rgba(28,47,110,.25);padding-bottom:2px}
.heft-label span{font-size:.82rem}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%;min-width:0}
button.item:hover{border-color:var(--ink)}
.item .grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--c,var(--c-sonst));color:#fff;white-space:nowrap}
.tchip{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--tint);color:var(--ink-soft)}
.mini-stamp{font-family:var(--f-hand);font-weight:700;color:var(--red);border:2px solid var(--red);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:1.5rem;flex:none;transform:rotate(-8deg)}
.subjhead{border-radius:var(--r);background:var(--c);color:#fff;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.subjhead h1{color:#fff}

/* Schulaufgabe */
.probe-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px}
.probe-head div{border-bottom:1px solid var(--line);padding-bottom:4px}
.probe-head small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.probe-head b{font-family:var(--f-hand);font-size:1.45rem;line-height:1.1}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem}
.dot.done{background:var(--tint);border-color:var(--ink-soft)}
.dot.cur{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.aufg{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.aufg .anr{font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.aufg .pts{font-family:var(--f-hand);font-size:1.3rem;color:var(--red)}
.qtext{font-size:1.2rem;line-height:1.55}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.08rem}
.opt .let{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-soft);display:grid;place-items:center;font-weight:700;flex:none}
.opt.sel{border-color:var(--ink);background:var(--tint)}
.opt.sel .let{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gapline{font-size:1.2rem;line-height:2.4}
.inp{border:0;border-bottom:2px solid var(--ink-soft);background:transparent;padding:4px 6px;font-family:var(--f-hand);font-size:1.6rem;color:var(--ink);min-width:0}
.inp:focus{outline:none;border-bottom-color:var(--c-mathe);background:var(--tint)}
input.gap{width:9em;max-width:100%}
input.short{width:100%}
textarea.free{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background-image:linear-gradient(transparent 33px,var(--line) 34px);background-size:100% 34px;line-height:34px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Korrektur */
.result-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.stamp{width:128px;height:128px;border:4px solid var(--red);border-radius:50%;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-9deg);font-family:var(--f-hand);flex:none;animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both}
.stamp small{font-size:1.2rem;line-height:1}
.stamp b{font-size:4.2rem;line-height:.9}
@keyframes stamp{from{transform:scale(1.6) rotate(-20deg);opacity:0}to{transform:rotate(-9deg);opacity:1}}
.comment{font-family:var(--f-hand);color:var(--red);font-size:1.8rem;line-height:1.1}
.corr{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px dashed var(--line)}
.corr:first-child{border-top:0}
.mark{font-size:1.9rem;font-weight:700;line-height:1;text-align:center}
.mark.ok{color:var(--ok)} .mark.no{color:var(--red)} .mark.half{color:var(--c-englisch)}
.given{font-family:var(--f-hand);font-size:1.45rem;color:var(--ink);line-height:1.2}
.fb{font-family:var(--f-hand);font-size:1.35rem;color:var(--red);line-height:1.2}
.corr .pts{font-family:var(--f-hand);color:var(--red);font-size:1.2rem}

/* Eltern */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:700;font-size:.92rem}
.fin{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--ink-soft);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--tint)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{font-family:var(--f-display);font-size:1.1rem}
.file{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.file img,.file .ph{width:54px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none;background:var(--tint)}
.file .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.file .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pg{width:64px;padding:4px 8px}
.qprev{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.qprev .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ans{color:var(--ok);font-weight:700}
.pin{font-size:2rem;letter-spacing:.5em;text-align:center;font-family:var(--f-display)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.keys button{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700}
.spin{width:52px;height:52px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--red);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:28px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.keys{grid-template-columns:repeat(3,64px)}.result-top{justify-content:center;text-align:center}}
</style>
</head>
<body>
<style>
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
.steps li{padding-left:4px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem;background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;display:block}
.pick{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px;min-width:0;cursor:pointer;background:var(--surface)}
.pick.on{border-color:var(--ink);background:var(--tint)}
.pick input{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.pick img,.pick .ph{width:54px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none;background:var(--tint)}
.pick .grow{flex:1;min-width:0}
.pick .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
a{color:var(--c-mathe)}
.sheetrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.sheetrow .chk{flex:1 1 240px}
.sheetrow .btn{align-self:center}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.teil{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.verdict{font-family:var(--f-display);font-size:1.5rem;font-weight:800}
.chk{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);cursor:pointer;min-width:0}
.chk.on{border-color:var(--ink);background:var(--tint)}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.chk .grow{flex:1;min-width:0}
.src{font-size:.82rem;color:var(--ink-soft);display:flex;gap:6px;align-items:baseline}
.src::before{content:"";flex:none;width:9px;height:11px;border-radius:1px 3px 3px 1px;background:currentColor;opacity:.55;transform:translateY(1px)}
.prep{border-radius:var(--r);background:var(--ink);color:var(--paper);padding:20px;display:flex;flex-direction:column;gap:14px}
.prep h2{color:var(--paper)}
.prep .muted{color:var(--paper);opacity:.75}
.tog{display:flex;flex-wrap:wrap;gap:8px}
.tog button{border-radius:999px;border:2px solid var(--c);background:transparent;color:inherit;padding:6px 14px;font-weight:700;font-size:.95rem}
.tog button.on{background:var(--c);color:#fff}
.tog button:disabled{opacity:.4;cursor:not-allowed}
.prep .btn{border-color:var(--paper)}
.prep .btn.primary{background:var(--paper);color:var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.merk{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:1.12rem}
.fbok{border-left:4px solid var(--ok);background:var(--tint);padding:12px 14px;border-radius:8px}
.fbno{border-left:4px solid var(--red);background:var(--tint);padding:12px 14px;border-radius:8px}
.tt{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:start}
.tt b{padding-top:6px}
@media (max-width:440px){.tt{grid-template-columns:1fr}}
</style>

<script>
"use strict";
const SCOPES = "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file";
const GEM = "https://generativelanguage.googleapis.com/v1beta/";
const LENGTHS = {
  kurz:   {n:8,  min:10, name:"Kurzprobe",    mix:{mc:3, gap:2, short:2, free:1}},
  normal: {n:15, min:30, name:"Probe normal", mix:{mc:4, gap:4, short:4, free:3}},
  lang:   {n:20, min:45, name:"Probe lang",   mix:{mc:5, gap:5, short:5, free:5}}
};
const POINTS = {mc:1, gap:1, short:2, free:3};
const PARTS = {mc:["A","Wissen"], gap:["A","Wissen"], short:["B","Anwenden"], free:["C","Begründen und erklären"]};
const TEST_SIZE = 8, MAX_FILES = 10, MAX_BYTES = 15 * 1024 * 1024, MAX_RESULTS = 300;
const SUBJECTS = [
  {key:"Mathematik", short:"Mathe", c:"--c-mathe"},
  {key:"Deutsch", short:"Deutsch", c:"--c-deutsch"},
  {key:"HSU / Sachunterricht", short:"HSU", c:"--c-hsu"},
  {key:"Englisch", short:"Englisch", c:"--c-englisch"},
  {key:"Religion / Ethik", short:"Religion", c:"--c-religion"},
  {key:"Musik / Kunst", short:"Musik/Kunst", c:"--c-musik"},
  {key:"Sonstiges", short:"Sonstiges", c:"--c-sonst"}
];
const TYPES = {mc:"Ankreuzen", gap:"Lückentext", short:"Kurze Antwort", free:"Freie Antwort"};
const TYPE_ORDER = ["mc","gap","short","free"];
const WD = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const PREP_TOTAL = 12, MAX_PREPS = 200;
const PROVIDERS = {
  gemini:{name:"Gemini", long:"Gemini (Google)", keyUrl:"https://aistudio.google.com/apikey", keyHost:"aistudio.google.com/apikey", hint:"AIza…", mime:["image/jpeg","image/png","image/webp","image/heic","image/heif"]},
  claude:{name:"Claude", long:"Claude (Anthropic)", keyUrl:"https://console.anthropic.com/settings/keys", keyHost:"console.anthropic.com", hint:"sk-ant-…", mime:["image/jpeg","image/png","image/webp","image/gif"]},
  openai:{name:"ChatGPT", long:"ChatGPT (OpenAI)", keyUrl:"https://platform.openai.com/api-keys", keyHost:"platform.openai.com/api-keys", hint:"sk-…", mime:["image/jpeg","image/png","image/webp","image/gif"]}
};
const PKEYS = ["gemini","claude","openai"];

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const subj = k => SUBJECTS.find(s => s.key === k) || SUBJECTS[SUBJECTS.length-1];
const col = k => `var(${subj(k).c})`;
const fmtDate = t => new Date(t).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtP = n => String(n).replace(".",",");
const rid = () => Math.random().toString(36).slice(2,10);
const isEmpty = x => x == null || (typeof x === "string" && !x.trim());

/* ---------- lokale Einstellungen (nur Client-ID) ---------- */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const cfg = lsGet("lernheft.cfg") || {clientId:""};

const EMPTY = () => ({version:1, settings:{}, ai:{}, materials:[], results:[], processed:[], preps:[], imports:[], vocab:[], texts:[]});
const S = {
  view: cfg.clientId ? "signin" : "setup", busyMsg:"", err:"",
  D: EMPTY(), ids:{}, signedIn:false,
  subject:null, topic:null, test:null, last:null, gradeErr:"", saveErr:"", pendingResult:null,
  ptab:"add", pinIn:"", pinBad:false,
  add:{inbox:null, inboxErr:"", sel:{}, local:[], hint:"", subject:"auto", grade:"", busy:false, err:"", draft:null, showUsed:false},
  prep:null, prepSel:null, prepFor:"", ttDraft:null, openMat:null, confirmDel:null, openRes:null, setMsg:"", matMsg:"", models:{}, keyErr:"", keyErrP:"", keyBusy:"", aikeyP:"gemini", imp:null, impErr:""
};

/* ---------- Google-Anmeldung ---------- */
let tokenClient = null, token = null, tokenExp = 0, tokenWait = null;
function gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
function initGis(){
  if (tokenClient || !gisReady() || !cfg.clientId) return !!tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId, scope: SCOPES,
    callback: r => { const w = tokenWait; tokenWait = null; if (!w) return;
      if (r.error){ w.rej({code:"auth", message:r.error_description || r.error}); return; }
      token = r.access_token; tokenExp = Date.now() + (Number(r.expires_in)||3600)*1000; w.res(token); },
    error_callback: e => { const w = tokenWait; tokenWait = null; if (w) w.rej({code:"auth", message:(e && e.type) || "popup"}); }
  });
  return true;
}
/* Muss direkt aus einem Klick heraus aufgerufen werden, sonst blockiert der Browser das Anmeldefenster. */
let tokenPending = null;
function requestToken(){
  if (tokenPending) return tokenPending;
  tokenPending = new Promise((res, rej) => {
    if (!initGis()) return rej({code:"gis"});
    const tm = setTimeout(() => { if (tokenWait){ tokenWait = null; rej({code:"auth", message:"timeout"}); } }, 60000);
    tokenWait = {res: v => { clearTimeout(tm); res(v); }, rej: e => { clearTimeout(tm); rej(e); }};
    try{ tokenClient.requestAccessToken({prompt: ""}); }catch(e){ clearTimeout(tm); tokenWait = null; rej({code:"auth"}); }
  }).finally(() => { tokenPending = null; });
  return tokenPending;
}
const tokenFresh = (ms = 5*60*1000) => token && Date.now() < tokenExp - ms;
/* Erneuert die Google-Anmeldung, blockiert aber nie länger als 12 Sekunden. */
function refreshIfNeeded(){ if (S.signedIn && !tokenFresh(10*60*1000)) return Promise.race([requestToken().catch(() => null), new Promise(r => setTimeout(() => r(null), 12000))]); return Promise.resolve(token); }

/* ---------- Google Drive ---------- */
async function gapi(path, opts = {}){
  if (!tokenFresh(30*1000)) throw {code:"auth"};
  const r = await fetch("https://www.googleapis.com/" + path, {...opts, headers:{Authorization:"Bearer " + token, ...(opts.headers||{})}});
  if (r.status === 401){ token = null; throw {code:"auth"}; }
  if (!r.ok){ let m = ""; try{ m = (await r.json()).error.message; }catch(e){} throw {code:"drive", status:r.status, message:m}; }
  return r;
}
async function findByRole(role){

  const r = await gapi("drive/v3/files?spaces=drive&fields=files(id,name)&q=" + encodeURIComponent(q));
  return (await r.json()).files[0] || null;
}

function parseJson(t){
  try{ return JSON.parse(t); }catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try{ return JSON.parse(f[1]); }catch(e){} }
  const idx = ["{","["].map(c => t.indexOf(c)).filter(i => i >= 0);
  const a = idx.length ? Math.min(...idx) : -1, b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a){ try{ return JSON.parse(t.slice(a, b+1)); }catch(e){} }
  throw {code:"json"};
}

function httpErr(status, m){
  if (status === 429 || /quota|credit balance|billing|insufficient/i.test(m)) return {code:"quota", message:m};
  if (status === 404 || /model.*(not found|does not exist)|not_found/i.test(m)) return {code:"model", message:m};
  if (status === 401 || status === 403 || /api key|x-api-key|authentication|permission/i.test(m)) return {code:"key", message:m};
  if (status === 413 || /too large|too long|exceed|size/i.test(m)) return {code:"big", message:m};
  if (status === 500 || status === 502 || status === 503 || status === 504 || status === 529 || /overload|unavailable|try again/i.test(m)) return {code:"busy", message:m, status};
  return {code:"ai", message:m, status};
}
let aiLimitMs = 90000, aiAbort = null;
async function post(url, headers, body){
  let r; const ctl = new AbortController(); aiAbort = ctl;
  const tm = setTimeout(() => { ctl.timedOut = true; ctl.abort(); }, aiLimitMs);
  try{ r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json", ...headers}, body: JSON.stringify(body), signal: ctl.signal}); }
  catch(e){ clearTimeout(tm); if (ctl.timedOut) throw {code:"timeout"}; if (ctl.signal.aborted) throw {code:"cancelled"}; throw {code:"net", message: String((e && e.message) || e)}; }
  clearTimeout(tm);
  if (!r.ok){ let m = ""; try{ const j = await r.json(); m = (j.error && (j.error.message || j.error.type)) || ""; }catch(e){} throw httpErr(r.status, m); }
  return r.json();
}

async function callClaude(parts, key, model){

async function callOpenAI(parts, key, model){

async function askAI(parts, temperature = 0.6, limitMs = 90000){
  aiLimitMs = limitMs;
  const a = aiCfg(), p = a.provider, key = a.keys[p], model = a.models[p];
  if (!key || !model) throw {code:"key"};
  const call = () => ({gemini:callGemini, claude:callClaude, openai:callOpenAI}[p])(parts, key, model, temperature);
  let text;
  try{ text = await call(); }
  catch(e){
    if (!e || !["busy","net","ai"].includes(e.code)) throw e;
    await new Promise(r => setTimeout(r, 2500));
    text = await call();
  }
  if (!text) throw {code:"blocked"};
  try{ return parseJson(text); }
  catch(e){ const again = await call(); return parseJson(again || ""); }
}
function aiErr(e){

  if (c === "model") return `Das eingestellte ${n}-Modell ist nicht verfügbar. Wähle unter Einstellungen ein anderes Modell.`;
  if (c === "big") return "Das ist zu viel Material auf einmal. Bitte weniger oder kleinere Dateien auswählen.";

  if (c === "timeout") return `${n} hat zu lange nicht geantwortet. Das kostenlose Gemini ist manchmal sehr langsam. Versuche es nochmal oder werte ohne die freien Antworten aus.`;
  if (c === "cancelled") return "Abgebrochen.";
  if (c === "busy") return `${n} ist gerade überlastet. Warte eine Minute und versuche es dann nochmal.`;
  const det = [e && e.status ? "Fehler " + e.status : "", e && e.message ? String(e.message).slice(0, 200) : ""].filter(Boolean).join(": ");
  if (c === "net") return `Das Lernheft erreicht ${n} nicht. Häufige Ursachen: ein Werbeblocker oder Inhaltsfilter im Browser, Jugendschutz-Einstellungen oder ein Schul-/Firmen-WLAN, das den Dienst sperrt.` + (det ? ` (Technisch: ${det})` : "");

}

const ver = (n, re) => { const m = n.match(re); return m ? parseFloat(m[1]) : 0; };

function pickWeighted(arr){ const tot = arr.reduce((s,x)=>s+x.w,0); let r = Math.random()*tot; for (let i=0;i<arr.length;i++){ r -= arr[i].w; if (r<=0) return i; } return arr.length-1; }
function buildTest(subject, matIds, len = "normal"){
  const L = LENGTHS[len] || LENGTHS.normal;
  const pool = [];
  for (const m of D().materials){
    if (m.subject !== subject || (matIds && !matIds.includes(m.id))) continue;
    for (const q of (m.questions||[])) pool.push({...q, key:m.id+":"+q.id, src: srcLabel(m)});
  }
  const last = {};
  const hist = [...D().results, ...(D().preps||[])].sort((a,b) => b.createdAt - a.createdAt);
  for (const r of hist) for (const it of (r.items||[])) if (it.key && !(it.key in last) && it.points != null) last[it.key] = it.max ? it.points/it.max : 0;
  for (const q of pool){ const l = last[q.key]; q.w = l == null ? 2 : l < .5 ? 4 : l < 1 ? 2.5 : .7; }
  const chosen = [];
  for (const t of TYPE_ORDER){
    for (let k = 0; k < L.mix[t]; k++){ const c = pool.filter(q => q.type === t); if (!c.length) break; const q = c[pickWeighted(c)]; chosen.push(q); pool.splice(pool.indexOf(q),1); }
  }
  while (chosen.length < L.n && pool.length){ const i = pickWeighted(pool); chosen.push(pool[i]); pool.splice(i,1); }
  chosen.sort((a,b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
  return chosen.map(q => ({...q, points: POINTS[q.type] || 1}));
}
function norm(s, strict){

}
function asNum(s){ const t = String(s).trim().replace(/\s/g,"").replace(",","."); return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : null; }
function matches(given, accepted, strict){
  const gn = asNum(given);
  return (accepted||[]).some(a => { const an = asNum(a); if (gn != null && an != null) return Math.abs(gn-an) < 1e-9; return norm(given, strict) === norm(a, strict); });
}

  for (const r of hist) for (const it of (r.items||[])) if (it.key && !(it.key in last) && it.points != null) last[it.key] = it.max ? it.points/it.max : 0;
  const steps = [];
  for (const sj of subjects){
    const L = latestLesson(sj); if (!L) continue;
    const pts = []; for (const m of L.latest){ for (const p of (m.keyPoints && m.keyPoints.length ? m.keyPoints : [m.summary])) if (p && !pts.includes(p)) pts.push(p); }
    steps.push({kind:"recap", subject:sj, day:L.day, topics:[...new Set(L.latest.map(m => m.topic))], points: pts.slice(0,5)});
    const mk = ms => ms.flatMap(m => (m.questions||[]).filter(q => q.type !== "free").map(q => ({...q, key:m.id+":"+q.id, src: srcLabel(m), w: last[m.id+":"+q.id] == null ? 2 : last[m.id+":"+q.id] < 1 ? 3 : .8})));
    let pool = mk(L.latest); const chosen = [];
    while (chosen.length < per && pool.length){ const i = pickWeighted(pool); chosen.push(pool[i]); pool.splice(i,1); }
    if (chosen.length < per){ pool = mk(L.older); while (chosen.length < per && pool.length){ const i = pickWeighted(pool); chosen.push(pool[i]); pool.splice(i,1); } }
    chosen.sort((a,b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
    for (const q of chosen) steps.push({kind:"q", subject:sj, q});
  }
  return {target: isoDay(target), dayName: WD[target.getDay()], subjects, steps, idx:0, answers:{}, checked:{}, start: Date.now(), saved:false};
}

function inputFor(q, a, mcAct, locked){

function grading(){ return `<section class="card center"><div class="spin"></div><h2>Deine Probe wird korrigiert …</h2><p class="small muted" id="gradeClock">0 Sekunden</p><div id="gradeSkip" hidden><p class="small">Das dauert gerade länger als sonst.</p><div class="row" style="justify-content:center"><button type="button" class="btn sm" data-act="grade-cancel">Abbrechen</button><button type="button" class="btn sm" data-act="grade-without">Ohne die freien Antworten auswerten</button></div></div><p class="muted">Das dauert einen kleinen Moment.</p></section>`; }

/* ---------- Material verarbeiten ---------- */
function blobToB64(b){ return new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); }); }
async function prepImage(blob){
  try{
    const bmp = await createImageBitmap(blob, {imageOrientation:"from-image"});
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, "image/jpeg", .85));
    if (out) return {blob:out, mime:"image/jpeg"};
  }catch(e){}
  return null;
}
async function toPart(blob, mime, name){
  if (mime.startsWith("image/")){
    const p = await prepImage(blob);
    if (p){ blob = p.blob; mime = p.mime; }
    else if (!PROVIDERS[aiCfg().provider].mime.includes(mime)) throw {code:"material", message:`„${name}“ hat ein Bildformat, das nicht gelesen werden kann. Bitte als JPG speichern.`};
  } else if (mime !== "application/pdf") throw {code:"material", message:`„${name}“ ist weder Foto noch PDF.`};
  return {size: blob.size, part:{inline_data:{mime_type:mime, data: await blobToB64(blob)}}};
}
function genPrompt(grade, nFiles){
  const A = S.add;
  const existing = catalog().map(s => `${s.key}: ${s.areas.map(a => a.area).join("; ")}`).join("\n");
  return `Du bist eine erfahrene Grundschullehrerin in Deutschland. Ein Elternteil hat Unterrichtsmaterial seines Kindes hochgeladen (Arbeitsblätter oder Schulbuchseiten, ${nFiles} ${nFiles===1?"Datei":"Dateien"} im Anhang). Das Kind geht in Klasse ${grade}.
${A.hint.trim() ? `Hinweis der Eltern: ${A.hint.trim()}` : ""}
${A.subject !== "auto" ? `Das Fach ist: ${A.subject}.` : ""}
${existing ? `Bereits vorhandene Themenbereiche je Fach (verwende genau denselben Namen, wenn das Material dazu gehört):\n${existing}` : ""}

Deine Aufgabe:
1. Bestimme das Fach, genau einer dieser Werte: ${SUBJECTS.map(s=>s.key).join(", ")}.
2. Ordne das Material einem Themenbereich zu ("area"): der größere Unterrichtsblock, zu dem mehrere Arbeitsblätter gehören, 1 bis 3 Wörter, z. B. "Gemeinde", "Wortarten", "Rechtschreibung", "Multiplikation", "Seasons and months". Gehört es zu einem vorhandenen Themenbereich, nimm dessen Namen. Bestimme außerdem das Thema des Blattes ("topic"): kurz (2 bis 5 Wörter), ohne den Themenbereich davor, z. B. "Aufgaben der Gemeinde" oder "Nomen und Artikel".
3. Gib dem Material eine kurze Bezeichnung (z. B. "Arbeitsblatt Nomen und Artikel"), fasse in 1 bis 2 Sätzen zusammen, was geübt wird, und schreibe 3 bis 5 kurze Merksätze ("keyPoints") in Du-Form, die das Kind am Abend vor der nächsten Stunde wiederholen soll (z. B. "Nomen schreibt man groß.").
4. Lies das Datum, das auf dem Blatt oder der Seite steht (oft oben rechts, z. B. "Datum: 23.10."), und gib es als "lessonDate" zurück: genau so wie es dasteht, z. B. "23.10.2026" oder "23.10.". Bei mehreren Blättern mit verschiedenen Daten nimm das späteste. Steht kein Datum da, setze "lessonDate": null. Erfinde kein Datum.
5. Nur wenn das Fach Englisch ist: Liste unter "vocab" alle Vokabeln des Materials auf, als [{"en":"autumn","de":"der Herbst","topic":"Seasons"}] (englische Nomen ohne Artikel, deutsche mit Artikel). Bei anderen Fächern "vocab": [].
6. Schreibe 20 Fragen, die genau den Stoff dieses Materials abfragen: 5 vom Typ "mc", 5 "gap", 5 "short", 5 "free". "mc" und "gap" prüfen Wissen, "short" prüft Anwenden (z. B. rechnen, ein Wort richtig schreiben, einen Begriff nennen), "free" verlangt Begründen oder Erklären in eigenen Worten.

Regeln für die Fragen:
- Kindgerechte, einfache Sprache in Du-Form, passend für Klasse ${grade}.
- Jede Frage muss ohne Bild beantwortbar sein. Nie "siehe Abbildung" oder "auf dem Arbeitsblatt".
- Nicht nur abschreiben: stelle neue, ähnliche Aufgaben im Stil des Materials (andere Zahlen, andere Wörter, andere Beispiele).
- Vom Leichten zum Schweren. Genau eine eindeutig richtige Lösung bei "mc", "gap" und "short". Prüfe jede Lösung sorgfältig, besonders Rechenaufgaben.
- "mc": "prompt", "options" (3 oder 4 kurze Antworten), "correct" (Index der richtigen Antwort, beginnend bei 0).
- "gap": "prompt" (Arbeitsanweisung), "text" (ein Satz mit genau einer Lücke, geschrieben als ___ aus drei Unterstrichen), "accepted" (Liste aller richtigen Lösungen).
- "short": "prompt", "accepted" (Liste gültiger Antworten, z. B. Zahl oder ein Wort, auch gängige Schreibvarianten).
- "free": "prompt" (Antwort in 1 bis 2 Sätzen), "modelAnswer" (Musterlösung), "rubric" (was für volle Punktzahl nötig ist).
- Jede Frage hat "explanation": ein kurzer, kindgerechter Satz, warum die Lösung stimmt.
- Wenn das Material unlesbar ist oder kein Schulstoff, antworte mit {"error": "kurze Begründung auf Deutsch"}.

Antworte nur mit einem JSON-Objekt in genau dieser Form:
{"subject":"Deutsch","area":"Wortarten","topic":"Nomen und Artikel","title":"Arbeitsblatt Nomen","summary":"…","keyPoints":["…","…","…"],"vocab":[],"lessonDate":"23.10.2026","questions":[{"type":"mc","prompt":"…","options":["…","…","…"],"correct":0,"explanation":"…"},{"type":"gap","prompt":"Setze das passende Wort ein.","text":"Der ___ bellt laut.","accepted":["Hund"],"explanation":"…"},{"type":"short","prompt":"…","accepted":["…"],"explanation":"…"},{"type":"free","prompt":"…","modelAnswer":"…","rubric":"…","explanation":"…"}]}`;
}
function strList(x){ return (Array.isArray(x) ? x : x != null ? [x] : []).map(v => String(v).trim()).filter(Boolean); }
function cleanQ(q){
  if (!q || typeof q !== "object") return null;
  const type = q.type, prompt = String(q.prompt || "").trim(), base = {id: rid(), type, prompt, explanation: String(q.explanation || "").trim()};
  if (type === "mc"){ const options = strList(q.options).slice(0,5), correct = Number(q.correct); if (!prompt || options.length < 2 || !Number.isInteger(correct) || correct < 0 || correct >= options.length) return null; return {...base, options, correct}; }
  if (type === "gap"){ const text = String(q.text || "").replace(/_{2,}/g,"___"), accepted = strList(q.accepted); if (!text.includes("___") || !accepted.length) return null; return {...base, prompt: prompt || "Setze das fehlende Wort ein.", text, accepted}; }
  if (type === "short"){ const accepted = strList(q.accepted); if (!prompt || !accepted.length) return null; return {...base, accepted}; }
  if (type === "free"){ const modelAnswer = String(q.modelAnswer || "").trim(); if (!prompt || !modelAnswer) return null; return {...base, modelAnswer, rubric: String(q.rubric || "").trim()}; }
  return null;
}
async function generate(){

      const f = byId[id]; if (!f) continue;
      const p = await toPart(await downloadFile(id), f.mimeType, f.name);
      parts.push(p.part); size += p.size; used.push(id); src[f.mimeType === "application/pdf" ? "pdf" : "foto"]++;
    }
    for (const f of A.local){
      const mime = f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : "image/jpeg");
      const p = await toPart(f, mime, f.name); parts.push(p.part); size += p.size; src[mime === "application/pdf" ? "pdf" : "foto"]++;

    if (!parts.length) throw {code:"material", message:"Bitte wähle mindestens eine Datei aus."};
    if (size > MAX_BYTES) throw {code:"big"};
    A.busy = `${provName()} liest das Material und schreibt Fragen … (meist 20 bis 60 Sekunden)`; render();

    A.draft = {subject, area: String(out.area || "").trim() || String(out.topic || "").trim() || "Neuer Themenbereich", topic: String(out.topic || "").trim() || "Neues Thema", title: String(out.title || "").trim(), summary: String(out.summary || "").trim(), keyPoints: strList(out.keyPoints).slice(0,5), vocab: subject === "Englisch" ? cleanVocab(out.vocab, String(out.area || out.topic || "")) : [], lessonDate: lessonFound || photoDay || isoDay(new Date()), dateSource: lessonFound ? "blatt" : photoDay ? "foto" : "heute", grade:Number(grade), questions, source, used};
  }catch(e){ A.err = aiErr(e); }

function normDate(x){
  const t = String(x || "").trim(); if (!t) return null;
  let y, m, d, hadYear = true, r;
  if ((r = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){ y = +r[1]; m = +r[2]; d = +r[3]; }
  else if ((r = t.match(/(\d{1,2})\s*\.\s*(\d{1,2})\s*\.?\s*(\d{2,4})?/))){ d = +r[1]; m = +r[2]; if (r[3]) y = +r[3] < 100 ? 2000 + +r[3] : +r[3]; else hadYear = false; }
  else return null;
  const now = new Date(); now.setHours(12,0,0,0);
  if (!hadYear) y = now.getFullYear();
  let dt = new Date(y, m-1, d, 12);
  if (dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  if (!hadYear && dt > now) dt = new Date(y-1, m-1, d, 12);
  if (dt.getTime() > now.getTime() + 864e5 || now - dt > 2*365*864e5) return null;
  return isoDay(dt);
}

/* ---------- Startpaket-Import ---------- */
function mapSubject(x){
  const t = String(x || "").trim().toLowerCase();
  const hit = SUBJECTS.find(s => s.key.toLowerCase() === t || s.short.toLowerCase() === t) || SUBJECTS.find(s => t && (s.key.toLowerCase().includes(t) || t.includes(s.short.toLowerCase())));
  if (hit) return hit.key;
  if (/sach|hsu|natur|heimat/.test(t)) return "HSU / Sachunterricht";
  if (/reli|ethik/.test(t)) return "Religion / Ethik";
  if (/musik|kunst|werken/.test(t)) return "Musik / Kunst";
  return "Sonstiges";
}
function parseImport(text, name, fileId){
  let obj; try{ obj = JSON.parse(String(text).replace(/^﻿/, "")); }catch(e){ throw {code:"material", message:`„${name}“ ist keine gültige Startpaket-Datei.`}; }
  const arr = Array.isArray(obj) ? obj : Array.isArray(obj && obj.materials) ? obj.materials : [];
  const materials = []; let skipped = 0;
  for (const m of arr){
    const questions = (Array.isArray(m && m.questions) ? m.questions : []).map(cleanQ).filter(Boolean);
    const topic = String((m && m.topic) || "").trim();
    if (!questions.length || !topic){ skipped++; continue; }
    materials.push({subject: mapSubject(m.subject), area: String(m.area || "").trim() || undefined, topic, title: String(m.title || "").trim(), summary: String(m.summary || "").trim(),
      keyPoints: strList(m.keyPoints).slice(0,5), lessonDate: normDate(m.lessonDate) || isoDay(new Date()),
      grade: Number(m.grade) || Number(D().settings.grade) || null, source: "Startpaket", questions});
  }
  const vocab = cleanVocab(obj && obj.vocab);
  if (!materials.length && !vocab.length) throw {code:"material", message:`In „${name}“ wurden keine verwendbaren Fragen gefunden.`};
  return {name, fileId, materials, vocab, skipped, importKey: obj && obj.id ? String(obj.id) : null};
}

async function doImport(){

let gradeRun = 0, gradeTimer = null;
async function grade(force){
  const run = ++gradeRun;
  if (aiAbort && force) try{ aiAbort.abort(); }catch(e){}
  const t = S.test, strict = t.subject === "Deutsch";
  S.view = "grading"; render();
  const g0 = Date.now(); clearInterval(gradeTimer);
  gradeTimer = setInterval(() => { if (S.view !== "grading" || run !== gradeRun) return clearInterval(gradeTimer);
    const sec = Math.round((Date.now() - g0) / 1000), c = document.getElementById("gradeClock"), k = document.getElementById("gradeSkip");
    if (c) c.textContent = sec + " Sekunden"; if (k && sec >= 15) k.hidden = false; }, 1000);
  const items = t.qs.map((q,i) => {
    const a = t.answers[i];
    const it = {key:q.key, type:q.type, prompt:qPrompt(q), max:q.points, points:null, feedback:"", explanation:q.explanation || "", src:q.src || ""};
    if (q.type === "mc"){ it.given = a == null ? "" : q.options[a]; it.expected = q.options[q.correct]; it.points = a === q.correct ? q.points : 0; }
    else { it.given = String(a || "").trim(); it.expected = q.type === "free" ? q.modelAnswer : q.accepted[0];
      if (!it.given) it.points = 0; else if (q.type !== "free" && matches(it.given, q.accepted, strict)) it.points = q.points; }
    return it;
  });
  const open = items.map((_,i) => i).filter(i => items[i].points == null);
  if (open.length && !force){
    try{
      const tasks = open.map(i => { const q = t.qs[i]; return {i, typ:TYPES[q.type], aufgabe: q.type === "gap" ? q.prompt + " " + q.text : q.prompt, erwartet: q.type === "free" ? q.modelAnswer + (q.rubric ? " | Für volle Punkte: " + q.rubric : "") : q.accepted.join(" / "), antwort: items[i].given, max: q.points}; });
      const prompt = `Du korrigierst eine kurze Schulaufgabe eines Kindes der Klasse ${D().settings.grade || "3"} (Grundschule) im Fach ${t.subject}. Bewerte jede Antwort fair, freundlich und kindgerecht.
Regeln:
- Es zählt der Inhalt. Rechtschreibung zählt nur, wenn die Aufgabe genau Rechtschreibung, Groß- und Kleinschreibung oder Wortformen prüft (meist im Fach Deutsch).
- Vergib 0 bis max Punkte, auch halbe Punkte sind erlaubt.
- "feedback": ein kurzer, ermutigender Satz in Du-Form, bei Fehlern mit einem Hinweis, was richtig wäre.
Aufgaben:
${JSON.stringify(tasks)}
Antworte nur mit einem JSON-Objekt: {"ergebnisse":[{"i":0,"points":1,"feedback":"…"}]}`;
      const res = await askAI([{text: prompt}], 0.2, 45000);
      if (run !== gradeRun) return;
      for (const r of (Array.isArray(res) ? res : (res && res.ergebnisse) || [])){
        const it = items[Number(r.i)]; if (!it || it.points != null) continue;
        it.points = Math.max(0, Math.min(it.max, Math.round(Number(r.points)*2)/2 || 0));
        it.feedback = String(r.feedback || "").trim();
      }
    }catch(e){ if (run !== gradeRun) return; clearInterval(gradeTimer); S.gradeErr = aiErr(e && e.code ? e : {code:"ai", message: String((e && e.message) || e)}); S.view = "gradeErr"; return render(); }
  }
  for (const it of items) if (it.points == null && it.type !== "free") it.points = 0;
  const note = items.some(it => it.points == null) ? "Die freien Antworten wurden nicht bewertet und zählen nicht zur Note." : "";
  const scored = items.filter(it => it.points != null);
  const points = scored.reduce((s,it)=>s+it.points,0), max = scored.reduce((s,it)=>s+it.max,0), percent = max ? Math.round(points/max*100) : 0;
  const r = {id: rid() + rid(), kind: t.len === "kurz" ? "kurz" : (t.len === "hoeren" || t.len === "lesen") ? t.len : "probe", len:t.len, matId:t.matId, textId:t.textId || null, minutes: Math.round((Date.now() - t.start)/60000), subject:t.subject, topic:t.label, area:t.area, createdAt:Date.now(), points, max, percent, grade:gradeOf(percent), note, items};
  if (run !== gradeRun) return;
  clearInterval(gradeTimer);
  S.last = r; S.saveErr = ""; S.view = "result"; render();
  saveResult(r);
}

}

/* ---------- Vorlesen (Tablet-Stimme) ---------- */
function ttsOk(){ return "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined"; }
function pickVoice(lang){
  try{
    const vs = speechSynthesis.getVoices() || [];
    const pre = lang.slice(0,2).toLowerCase();
    const cand = vs.filter(v => (v.lang || "").toLowerCase().replace("_","-").startsWith(pre));
    const exact = cand.filter(v => (v.lang || "").toLowerCase().replace("_","-") === lang.toLowerCase());
    const list = exact.length ? exact : cand;
    return list.find(v => /google|enhanced|premium|natural/i.test(v.name)) || list.find(v => v.localService) || list[0] || null;
  }catch(e){ return null; }
}
try{ if (ttsOk()) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } }catch(e){}
function chunkText(text){
  const sents = String(text).replace(/\s+\n/g, "\n").split(/(?<=[.!?…:])\s+|\n+/).map(x => x.trim()).filter(Boolean);
  const out = []; let cur = "";
  for (const x of sents){ if ((cur + " " + x).length > 220 && cur){ out.push(cur); cur = x; } else cur = cur ? cur + " " + x : x; }
  if (cur) out.push(cur);
  return out;
}
let speaker = null;
/* Muss direkt aus einem Klick heraus starten (iPad), danach laufen die Sätze nacheinander. */
function speak(text, {lang = "de-DE", rate = 0.9, onProgress, onEnd} = {}){
  stopSpeak();
  if (!ttsOk()){ onEnd && onEnd(false); return null; }
  const chunks = chunkText(text), voice = pickVoice(lang);
  const ctl = {stopped:false, i:0, n:chunks.length};
  const next = () => {
    if (ctl.stopped) return;
    if (ctl.i >= chunks.length){ speaker = null; onEnd && onEnd(true); return; }
    const u = new SpeechSynthesisUtterance(chunks[ctl.i]);
    u.lang = lang; u.rate = rate; if (voice) u.voice = voice;
    u.onend = () => { ctl.i++; onProgress && onProgress(ctl.i / ctl.n); setTimeout(next, 120); };
    u.onerror = e => { if (ctl.stopped || (e && (e.error === "interrupted" || e.error === "canceled"))) return; ctl.i++; setTimeout(next, 120); };
    speechSynthesis.speak(u);
  };
  speaker = ctl; next();
  return ctl;
}
function stopSpeak(){ if (speaker) speaker.stopped = true; speaker = null; try{ if (ttsOk()) speechSynthesis.cancel(); }catch(e){} }
function sayWord(w, lang = "en-GB"){ if (!ttsOk() || !w) return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = lang; u.rate = 0.85; const v = pickVoice(lang); if (v) u.voice = v; speechSynthesis.speak(u); }catch(e){} }
let wakeLock = null;
async function keepAwake(on){
  try{
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}

      render(); break; }
    case "ptab": S.ptab = b.dataset.t; S.setMsg = ""; S.ttMsg = ""; S.aiMsg = ""; if (S.ptab === "settings") S.ttDraft = JSON.parse(JSON.stringify(D().settings.timetable || {})); render(); if (S.ptab === "add" && !S.add.inbox) loadInbox(); break;
    case "inbox-reload": await refreshIfNeeded(); loadInbox(); break;
    case "toggle-used": S.add.showUsed = !S.add.showUsed; render(); break;
    case "rmlocal": S.add.local.splice(Number(b.dataset.i),1); render(); break;
    case "generate": await refreshIfNeeded(); generate(); break;
    case "dDel": S.add.draft.questions.splice(Number(b.dataset.i),1); render(); break;
    case "save-draft": await refreshIfNeeded(); saveDraft(); break;
    case "discard-draft": S.add.draft = null; S.add.err = ""; render(); break;
    case "mat-open": S.openMat = S.openMat === b.dataset.m ? null : b.dataset.m; render(); break;
    case "mat-del": S.confirmDel = b.dataset.m; render(); break;
    case "mat-del-no": S.confirmDel = null; render(); break;
    case "mat-del-yes": { const id = b.dataset.m; await refreshIfNeeded();
      try{ await mutate(d => { d.materials = d.materials.filter(m => m.id !== id); }); S.confirmDel = null; S.matMsg = ""; }catch(e){ S.matMsg = driveErr(e); }
      render(); break; }
    case "q-del": { const mid = b.dataset.m, qid = b.dataset.q; b.disabled = true; await refreshIfNeeded();
      try{ await mutate(d => { const m = d.materials.find(x => x.id === mid); if (m) m.questions = m.questions.filter(q => q.id !== qid); }); S.matMsg = ""; }catch(e){ S.matMsg = driveErr(e); }
      render(); break; }
    case "prep-tog": { const k = b.dataset.s; S.prepSel = S.prepSel.includes(k) ? S.prepSel.filter(x => x !== k) : [...S.prepSel, k]; render(); break; }
    case "prep-start": { refreshIfNeeded(); const subs = SUBJECTS.map(s => s.key).filter(k => S.prepSel.includes(k)); S.prep = buildPrep(subs, nextSchoolDay()); S.saveErr = ""; if (!S.prep.steps.length) return; go("prep"); prepTick(); break; }
    case "pmc": S.prep.answers[S.prep.idx] = Number(b.dataset.i); render(); break;
    case "prep-check": prepCheck(false); break;
    case "prep-skip": prepCheck(true); break;
    case "prep-next": S.prep.idx++; if (S.prep.idx >= S.prep.steps.length){ await refreshIfNeeded(); go("prep"); prepSave(); } else { render(); window.scrollTo(0,0); } break;
    case "prep-quit": S.prep.idx = S.prep.steps.length; if (Object.keys(S.prep.checked).length){ await refreshIfNeeded(); go("prep"); prepSave(); } else go("home"); break;
    case "prep-save": await refreshIfNeeded(); prepSave(); break;
    case "tt-tog": { const d = b.dataset.d, k = b.dataset.s; const cur = S.ttDraft[d] || []; S.ttDraft[d] = cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k]; S.ttMsg = ""; render(); break; }
    case "tt-save": { const tt = JSON.parse(JSON.stringify(S.ttDraft)); await refreshIfNeeded();
      try{ await mutate(d => { d.settings = {...d.settings, timetable: tt}; }); S.ttMsg = "Gespeichert."; S.prepSel = null; }catch(e){ S.ttMsg = driveErr(e); }
      render(); break; }
    case "imp-open": { await refreshIfNeeded(); const f = (S.add.inbox || []).find(x => x.id === b.dataset.id); if (f) openImport(f); break; }
    case "imp-do": await refreshIfNeeded(); doImport(); break;
    case "imp-cancel": S.imp = null; S.impErr = ""; render(); break;
    case "areas-ai": await refreshIfNeeded(); sortAreasAI(); break;
    case "area-edit": { S.areaEdit = S.areaEdit || {}; const m = D().materials.find(x => x.id === b.dataset.m); S.areaEdit[b.dataset.m] = m ? areaOf(m) : ""; render(); break; }
    case "area-cancel": delete S.areaEdit[b.dataset.m]; render(); break;
    case "area-save": { const id = b.dataset.m, v = String(S.areaEdit[id] || "").trim(); if (!v) return;
      await refreshIfNeeded();
      try{ await mutate(d => { const m = d.materials.find(x => x.id === id); if (m) m.area = v; }); delete S.areaEdit[id]; S.matMsg = "Gespeichert."; }catch(e){ S.matMsg = driveErr(e); }
      render(); break; }
    case "lit": S.litKind = b.dataset.k; S.litErr = ""; S.subject = "Deutsch"; go("lit"); break;
    case "lit-new": createLit(S.litKind); break;
    case "lit-open": { const t = (D().texts || []).find(x => x.id === b.dataset.t); if (!t) return; startLitTest(t);
      if (t.kind === "hoeren"){ S.hear = {textId:t.id, phase:"intro"}; go("hear"); }
      else { S.readTextId = t.id; go("readp"); clearInterval(readTimer); readTimer = setInterval(() => { if (S.view !== "readp") return clearInterval(readTimer); const c = document.getElementById("quizClock"); if (c) c.textContent = `${Math.floor((Date.now() - S.test.start)/60000)} von ${LIT.lesen.min} Min.`; }, 20000); }
      break; }
    case "hear-go": hearPlay(1); break;
    case "hear-next": stopSpeak();
      if (S.hear.phase === "listen1"){ S.hear.phase = "read"; S.hear.readStart = Date.now(); render(); window.scrollTo(0,0);
        clearInterval(readTimer); readTimer = setInterval(() => { if (S.view !== "hear" || S.hear.phase !== "read") return clearInterval(readTimer); const c = document.getElementById("readClock"); const left = Math.max(0, 120 - Math.floor((Date.now() - S.hear.readStart)/1000)); if (c) c.textContent = left ? `noch ${Math.ceil(left/60)} Min.` : "Zeit ist um, starte das zweite Hören."; }, 5000); }
      else { S.hear.phase = "answer"; keepAwake(false); render(); window.scrollTo(0,0); }
      break;
    case "hear-go2": S.test.start = S.test.start || Date.now(); hearPlay(2); break;
    case "hear-quit": stopSpeak(); keepAwake(false); S.test = null; go("lit"); break;
    case "read-quit": S.test = null; go("lit"); break;
    case "lmc": { const qi = Number(b.dataset.q); S.test.answers[qi] = Number(b.dataset.i); S.test.confirm = false; render(); break; }
    case "lit-submit": if (S.test.answers.some(isEmpty)){ S.test.confirm = true; render(); } else { stopSpeak(); keepAwake(false); refreshIfNeeded(); grade(false); } break;
    case "lit-submit-force": stopSpeak(); keepAwake(false); refreshIfNeeded(); grade(false); break;
    case "confirm-no-lit": S.test.confirm = false; render(); break;
    case "vocab": S.subject = "Englisch"; S.vMsg = ""; go("vocab"); break;
    case "v-home": go("vocab"); break;
    case "v-topic": S.vTopic = b.dataset.t || ""; render(); break;
    case "v-start": vStart(b.dataset.m); break;
    case "v-say": vSay(); break;
    case "v-check": vCheck(false); break;
    case "v-skip": vCheck(true); break;
    case "v-flip": S.voc.state = "shown"; sayWord(vAlts(vCur().en)[0]); render(); break;
    case "v-self": S.voc.res[vCur().id] = b.dataset.ok === "1"; S.voc.idx++; S.voc.state = null; render(); if (S.voc.idx >= S.voc.items.length){ await refreshIfNeeded(); vSave(); } break;
    case "v-next": S.voc.idx++; S.voc.state = null; S.voc.ans = "";
      if (S.voc.idx < S.voc.items.length && (S.voc.mode === "listen" || S.voc.mode === "en-de")) vSay();
      render(); if (S.voc.idx >= S.voc.items.length){ await refreshIfNeeded(); vSave(); } break;
    case "v-quit": S.voc.idx = S.voc.items.length; render(); await refreshIfNeeded(); vSave(); break;
    case "v-save": await refreshIfNeeded(); vSave(); break;
    case "v-collect": await refreshIfNeeded(); collectVocabAI(); break;
    case "v-add": { const en = document.getElementById("vaEn").value.trim(), de = document.getElementById("vaDe").value.trim(), tp = document.getElementById("vaTopic").value.trim() || "Sonstige";
      if (!en || !de){ S.vAdminMsg = "Bitte Englisch und Deutsch ausfüllen."; return render(); }
      await refreshIfNeeded();
      try{ let n = 0; await mutate(d => { n = addVocab(d, [{en, de, topic:tp}]); }); S.vAdminMsg = n ? "Gespeichert." : "Diese Vokabel gibt es schon."; }catch(e){ S.vAdminMsg = driveErr(e); }
      render(); break; }
    case "v-del": { const id = b.dataset.v; await refreshIfNeeded(); try{ await mutate(d => { d.vocab = (d.vocab || []).filter(v => v.id !== id); }); }catch(e){ S.vAdminMsg = driveErr(e); } render(); break; }
    case "res-open": S.openRes = S.openRes === b.dataset.r ? null : b.dataset.r; render(); break;
    case "save-settings": {
      const pin = document.getElementById("sPin").value.trim();
      if (pin && !/^\d{4}$/.test(pin)){ S.setMsg = "Die PIN muss aus genau 4 Ziffern bestehen."; return render(); }
      const st = {childName: document.getElementById("sName").value.trim(), grade: document.getElementById("sGrade").value, pin};
      await refreshIfNeeded();
      try{ await mutate(d => { d.settings = {...d.settings, ...st}; }); S.setMsg = "Gespeichert."; }catch(e){ S.setMsg = driveErr(e); }
      render(); break; }
    case "load-models": { const p = b.dataset.p; try{ S.models[p] = (await listModels(p, aiCfg().keys[p])).all; S.aiMsg = ""; }catch(e){ S.aiMsg = "Modelle konnten nicht geladen werden. Prüfe den Schlüssel."; } render(); break; }
    case "save-key": await refreshIfNeeded(); saveKey(b.dataset.p); break;
    case "ai-test": S.aiTesting = true; S.aiMsg = ""; render();
      try{ const r = await askAI([{text:'Antworte nur mit diesem JSON: {"ok":true}'}], 0, 30000); S.aiMsg = r && r.ok ? `Verbindung klappt. ${provName()} antwortet (Modell ${aiCfg().models[aiCfg().provider]}).` : `${provName()} antwortet, aber unerwartet.`; }
      catch(e){ S.aiMsg = aiErr(e); }
      S.aiTesting = false; render(); break;
    case "aikey-p": S.aikeyP = b.dataset.p; S.keyErr = ""; render(); break;
    case "ai-use": { const p = b.dataset.p; await refreshIfNeeded();
      try{ await mutate(d => { const a = aiCfg(d); a.provider = p; d.ai = a; }); S.aiMsg = `Gespeichert. Die App nutzt jetzt ${PROVIDERS[p].name}.`; }catch(e){ S.aiMsg = driveErr(e); }
      render(); break; }
    case "reload-data": await refreshIfNeeded(); try{ await reloadData(); S.setMsg = "Gespeichert. Daten sind aktuell."; }catch(e){ S.setMsg = driveErr(e); } render(); break;
    case "signout": if (token && gisReady()) google.accounts.oauth2.revoke(token, () => {}); token = null; S.signedIn = false; S.D = EMPTY(); go("signin"); break;
    case "copy-origin": try{ await navigator.clipboard.writeText(location.origin); b.textContent = "Kopiert"; }catch(e){ const r = document.createRange(); r.selectNodeContents(document.getElementById("origin")); getSelection().removeAllRanges(); getSelection().addRange(r); } break;
    case "save-client": { const v = document.getElementById("clientId").value.trim();
      if (!/\.apps\.googleusercontent\.com$/.test(v)){ S.err = "Die Client-ID endet auf .apps.googleusercontent.com. Bitte vollständig kopieren."; return render(); }
      cfg.clientId = v; lsSet("lernheft.cfg", cfg); tokenClient = null; S.err = ""; go("signin"); break; }
    case "edit-client": S.err = ""; go("setup"); break;
    case "signin": openApp(); break;
  }
}
function enterParent(){ if (!S.ttDraft) S.ttDraft = JSON.parse(JSON.stringify(D().settings.timetable || {})); if (S.ptab === "add" && !S.add.inbox) loadInbox(); }

$app.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && !b.disabled) act(b); });
$app.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.lq != null && S.test){ S.test.answers[Number(el.dataset.lq)] = el.value; return; }
  if (el.id === "vin" && S.voc){ S.voc.ans = el.value; return; }
  if (el.id === "ans" && S.view === "prep" && S.prep){ S.prep.answers[S.prep.idx] = el.value; const c = $app.querySelector('[data-act="prep-check"]'); if (c) c.disabled = !el.value.trim(); }
  else if (el.id === "ans" && S.test){ S.test.answers[S.test.idx] = el.value; const d = $app.querySelector(`.dot[data-i="${S.test.idx}"]`); if (d) d.classList.toggle("done", !!el.value.trim()); }
  else if (el.id === "hint") S.add.hint = el.value;
  else if (el.id === "dTopic") S.add.draft.topic = el.value;
  else if (el.id === "dArea") S.add.draft.area = el.value;
  else if (el.dataset.areaedit) S.areaEdit[el.dataset.areaedit] = el.value;
  else if (el.id === "dTitle") S.add.draft.title = el.value;
  else if (el.id === "dDate"){ S.add.draft.lessonDate = el.value; S.add.draft.dateSource = "hand"; }
});
$app.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.mat){ const id = el.dataset.mat; S.selMats = el.checked ? [...new Set([...S.selMats, id])] : S.selMats.filter(x => x !== id); render(); }
  else if (el.dataset.pick){ if (el.checked) S.add.sel[el.dataset.pick] = true; else delete S.add.sel[el.dataset.pick]; render(); }
  else if (el.id === "localFiles"){ S.add.local.push(...el.files); render(); }
  else if (el.id === "importFile" && el.files[0]){ const f = el.files[0]; S.impErr = ""; try{ S.imp = parseImport(await f.text(), f.name, null); }catch(err){ S.impErr = aiErr(err); } render(); }
  else if (el.id === "addGrade"){ S.add.grade = el.value; render(); }
  else if (el.id === "addSubject") S.add.subject = el.value;
  else if (el.id === "dSubject"){ S.add.draft.subject = el.value; render(); }
  else if (el.dataset.model){ const p = el.dataset.model, m = el.value; await refreshIfNeeded(); try{ await mutate(d => { const x = aiCfg(d); x.models[p] = m; d.ai = x; }); S.aiMsg = `Gespeichert. ${PROVIDERS[p].name}-Modell: ${m}`; }catch(err){ S.aiMsg = driveErr(err); } render(); }
});
$app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "vin" && S.voc){ e.preventDefault(); if (S.voc.state == null){ if (S.voc.ans.trim()) vCheck(false); } else act({dataset:{act:"v-next"}}); return; }
  if (e.key !== "Enter" || e.target.id !== "ans" || e.target.tagName !== "INPUT") return;
  if (S.view === "prep" && S.prep){ e.preventDefault(); if (!isEmpty(S.prep.answers[S.prep.idx])) prepCheck(false); }
  else if (S.view === "quiz" && S.test && S.test.idx < S.test.qs.length - 1){ e.preventDefault(); S.test.idx++; render(); }
});
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !S.signedIn || !tokenFresh() || !["home","topics"].includes(S.view)) return;
  try{ await reloadData(); render(); }catch(e){}
});
render();
</script>

</body>
